# Application Configuration

# TTS Settings
tts:
  voice: en-US-ChristopherNeural
  provider: edge-tts
  fallback_provider: kokoro
  kokoro:
    voice: am_adam
    model_path: assets/kokoro/kokoro-v0_19.onnx
    voices_path: assets/kokoro/voices.json

# Gemini AI Settings
gemini:
  model: gemini-flash-lite-latest

# Pacing Presets (multipliers and default pause values)
pacing_presets:
  mystery:
    name: Mystery
    baseline_rate: -0.05
    baseline_pitch: +0Hz
    sentence_pause: 0.6
    reveal_pause: 1.0
  hype:
    name: Hype
    baseline_rate: 0.1
    baseline_pitch: +2Hz
    sentence_pause: 0.3
    reveal_pause: 0.5
  calm:
    name: Calm
    baseline_rate: -0.1
    baseline_pitch: -2Hz
    sentence_pause: 0.8
    reveal_pause: 0.8

# Narration Settings
narration:
  min_duration_seconds: 60
  max_duration_seconds: 180

# Audio Post-Processing Enhancements (R2.12)
audio_enhancements:
  compression: true
  male_eq: true
  deesser: true
  reverb: true
  loudnorm: true
